# Compatibility URLs after retiring script_editor_api on port 8000.
# Install at /opt/homebrew/etc/nginx/snippets/retired-script-editor-locations.conf
# and include inside each production server block. API requests go through
# Next.js so its session, origin and signed-actor checks remain in the path.
location /sc_api/ {
    proxy_pass http://127.0.0.1:3000/api/sc_api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    proxy_read_timeout 180s;
}

location = /public {
    return 308 /resources/sermons;
}

location = /public/ {
    return 308 /resources/sermons;
}

# The retired HTML viewer's sitemap is no longer maintained.
location = /public/sitemap {
    return 410;
}

location /public/ {
    rewrite ^/public/(.+)$ /resources/sermons/$1 permanent;
}

location = /static {
    return 308 /static/;
}

location /static/ {
    alias /opt/homebrew/var/www/church/web/api/static/;
}
