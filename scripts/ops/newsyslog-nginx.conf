# nginx log rotation for macOS newsyslog (OPS-35, #421).
# Installed as /etc/newsyslog.d/smart-answer-nginx.conf by
# scripts/install-nginx-log-rotation.sh. newsyslog runs as root from launchd
# (com.apple.newsyslog) and checks these entries every hour.
#
# Every *.log in the nginx log directory (G = glob): rotate at midnight ($D0)
# or once it passes 100 MB, keep 14 gzip-compressed copies (Z), owned by the
# account the logs already belong to, then send nginx SIGUSR1 (30 on macOS)
# so it reopens its log files instead of writing to the rotated one.
#
# Before this, access.log had never been rotated and reached 3.1 GB (2026-10-07).
#
# logfilename                               owner:group    mode count size(KB) when flags pid_file                          sig
/opt/homebrew/var/log/nginx/*.log           junyang:admin  644  14    102400   $D0  GZ    /opt/homebrew/var/run/nginx.pid   30
